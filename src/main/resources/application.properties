spring.application.name=letsgogolfing
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.sql.init.mode=always

bbconfig.apiKey=${BB_API_KEY
bbconfig.projectId=${BB_PROJECT_ID}
bbconfig.baseUrl=https://api.browserbase.com/v1
bbconfig.email=${BB_EMAIL}
bbconfig.password=${BB_PASSWORD}

golfnow.email=${GOLFNOW_EMAIL}
golfnow.password=${GOLFNOW_PASSWORD}
golfnow.baseUrl=https://www.golfnow.com
golfnow.endpoints.tee-time-results=/api/tee-times/tee-time-results

spring.temporal.connection.target=local
spring.temporal.start-workers=true
spring.temporal.workersAutoDiscovery.packages=com.hooswhere.letsgogolfing
