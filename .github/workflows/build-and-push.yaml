name: Build and Push API to GitLab Registry

on:
    push:
        tags:
            - 'api-*'  # Only trigger on tags like api-0.0.1, api-1.2.3, etc.

env:
    GITLAB_REGISTRY: registry.gitlab.com
    GITLAB_PROJECT_PATH: smaldd14/docker-images

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GitLab Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.GITLAB_REGISTRY }}
                  username: ${{ secrets.GITLAB_USERNAME }}
                  password: ${{ secrets.GITLAB_TOKEN }}

            - name: Extract version from tag
              id: version
              run: |
                  # Extract version from tag (api-0.0.1 -> 0.0.1)
                  VERSION=${GITHUB_REF#refs/tags/api-}
                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  echo "Building API version: $VERSION"

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.GITLAB_REGISTRY }}/${{ env.GITLAB_PROJECT_PATH }}/letsgogolfing
                  tags: |
                      type=raw,value=latest
                      type=raw,value=${{ steps.version.outputs.version }}
                      type=raw,value={{tag}}
                  labels: |
                      org.opencontainers.image.title=Lets Go Golfing API
                      org.opencontainers.image.description=Spring Boot API application for Tee Time Monitor
                      org.opencontainers.image.version=${{ steps.version.outputs.version }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Output image details
              run: |
                  echo "🚀 Successfully built and pushed:"
                  echo "Image: ${{ env.GITLAB_REGISTRY }}/${{ env.GITLAB_PROJECT_PATH }}/letsgogolfing:${{ steps.version.outputs.version }}"
                  echo "Also tagged as: latest"